# pySigma processing pipeline: Sigma generic Windows fields -> Wazuh decoded field paths.
#
# Wazuh decodes Windows Event Log records into a nested JSON structure under
# data.win.system.* and data.win.eventdata.*, and lower-cases the first letter of
# every eventdata field. Wazuh also stores eventID as a STRING, so numeric Sigma
# values are converted before the field is renamed (order matters here).
name: wazuh-windows
priority: 20
transformations:

  # 1. Numeric EventID -> string, BEFORE the field is renamed.
  - id: eventid_to_string
    type: convert_type
    target_type: str
    field_name_conditions:
      - type: include_fields
        fields:
          - EventID

  # 2. Scope generic windows/security rules to the Security channel.
  - id: windows_security_channel
    type: add_condition
    conditions:
      Channel: Security
    rule_conditions:
      - type: logsource
        product: windows
        service: security

  # 3. Windows System block.
  - id: field_mapping_system
    type: field_name_mapping
    mapping:
      Channel: data.win.system.channel
      Computer: data.win.system.computer
      EventID: data.win.system.eventID
      Provider_Name: data.win.system.providerName

  # 4. Windows EventData block.
  - id: field_mapping_eventdata
    type: field_name_mapping
    mapping:
      AccessMask: data.win.eventdata.accessMask
      IpAddress: data.win.eventdata.ipAddress
      IpPort: data.win.eventdata.ipPort
      LogonType: data.win.eventdata.logonType
      ObjectName: data.win.eventdata.objectName
      ObjectServer: data.win.eventdata.objectServer
      ObjectType: data.win.eventdata.objectType
      PreAuthType: data.win.eventdata.preAuthType
      Properties: data.win.eventdata.properties
      ServiceName: data.win.eventdata.serviceName
      Status: data.win.eventdata.status
      SubjectDomainName: data.win.eventdata.subjectDomainName
      SubjectLogonId: data.win.eventdata.subjectLogonId
      SubjectUserName: data.win.eventdata.subjectUserName
      SubjectUserSid: data.win.eventdata.subjectUserSid
      TargetDomainName: data.win.eventdata.targetDomainName
      TargetUserName: data.win.eventdata.targetUserName
      TargetUserSid: data.win.eventdata.targetUserSid
      TicketEncryptionType: data.win.eventdata.ticketEncryptionType
      TicketOptions: data.win.eventdata.ticketOptions
