name: Build Deployable Queries

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build query artifacts for the Wazuh indexer
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build query artifacts
        run: ./scripts/build.sh

      # These artifacts are what you import into OpenSearch Dashboards / the
      # Wazuh indexer. Downloading them from a green build is the "deploy" step
      # until the lab is reachable from a self-hosted runner.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: detection-queries-${{ github.sha }}
          path: build/
          retention-days: 30
