title: AS-REP Roasting - Kerberos Pre-Authentication Disabled
id: 8f2c1d44-1b3e-4a9e-9b21-6a1d7f0c9e01
status: experimental
description: |
    Detects a Kerberos authentication ticket (TGT) request for an account that has
    Kerberos pre-authentication disabled. An attacker who can enumerate such accounts
    can request a TGT and crack the returned encrypted blob offline (AS-REP Roasting).
references:
    - https://attack.mitre.org/techniques/T1558/004/
author: Pouyan Khosravi
date: 2026-08-02
tags:
    - attack.credential-access
    - attack.t1558.004
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4768
        PreAuthType: '0'
    filter_machine_account:
        TargetUserName|endswith: '$'
    condition: selection and not filter_machine_account
falsepositives:
    - Legacy or service accounts intentionally configured with "Do not require Kerberos preauthentication"
    - Non-Windows Kerberos clients that do not send pre-authentication data
level: high
