title: Kerberoasting - RC4 Service Ticket Requested for a User-Backed SPN
id: c7d4e812-6a09-4f3b-8e2d-95b1a3f70c44
status: experimental
description: |
    Detects a Kerberos service ticket (TGS) request encrypted with RC4-HMAC for a
    service principal backed by a user account. RC4 tickets are far cheaper to crack
    offline than AES, so attackers explicitly downgrade to RC4 when Kerberoasting.
    Only low-noise in a domain baselined to AES.
references:
    - https://attack.mitre.org/techniques/T1558/003/
author: Pouyan Khosravi
date: 2026-08-02
tags:
    - attack.credential-access
    - attack.t1558.003
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4769
        TicketEncryptionType: '0x17'
        TicketOptions: '0x40810000'
    filter_machine_account:
        ServiceName|endswith: '$'
    filter_krbtgt:
        ServiceName: 'krbtgt'
    condition: selection and not 1 of filter_*
falsepositives:
    - Domains still permitting RC4 for backwards compatibility with legacy applications
    - Older or non-Windows clients that negotiate RC4 by default
level: high
